<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Vortex 14.0</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Links to your existing styles -->
    <link rel="stylesheet" href="./css/index.css" />
    
    <!-- Razorpay SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        .payment-container {
            height: calc(100vh - 75px);
            margin-top: 75px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        
        .payment-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 3rem 2rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 243, 255, 0.1);
            border-top-color: var(--primary-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .back-btn {
            display: none;
            margin-top: 1.5rem;
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, var(--primary-cyan), var(--primary-purple));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .back-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Minimal Navbar -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="photos/vortex_L.png" alt="Vortex 14.0" class="logo-light" />
            <img src="photos/vortex_D.png" alt="Vortex 14.0" class="logo-dark" />
        </a>
    </nav>

    <!-- Background Elements -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Payment UI -->
    <main class="payment-container">
        <div class="payment-box">
            <div class="spinner" id="spinner"></div>
            <div class="vortex-modal-icon" id="statusIcon" style="display: none;"></div>
            <h2 class="font-heading" id="statusText" style="font-size: 1.2rem; color: var(--text-main);">Initializing Secure Gateway...</h2>
            <p id="subText" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">Please do not refresh or close this page.</p>
            <div id="receiptStub" style="display: none;"></div>
            
            <button id="backBtn" class="back-btn">Back to Checkout</button>
        </div>
    </main>

    <script>
        // Sync saved theme
        const savedTheme = localStorage.getItem("vortex_theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);

        // In-page modal helper
        function showVortexModal({ type = "warning", title, message, btnText = "Continue", onConfirm }) {
            let overlay = document.getElementById("vortexModalOverlay");
            if (!overlay) {
                overlay = document.createElement("div");
                overlay.id = "vortexModalOverlay";
                overlay.className = "vortex-modal-overlay";
                document.body.appendChild(overlay);
            }

            const icons = {
                success: "fa-solid fa-circle-check",
                error: "fa-solid fa-circle-xmark",
                warning: "fa-solid fa-triangle-exclamation"
            };

            overlay.innerHTML = `
                <div class="vortex-modal-card">
                    <div class="vortex-modal-icon ${type}">
                        <i class="${icons[type] || icons.warning}"></i>
                    </div>
                    <h3 class="vortex-modal-title">${title}</h3>
                    <p class="vortex-modal-msg">${message}</p>
                    <button type="button" class="vortex-modal-btn" id="vortexModalBtn">${btnText}</button>
                </div>
            `;

            requestAnimationFrame(() => overlay.classList.add("active"));

            document.getElementById("vortexModalBtn").onclick = () => {
                overlay.classList.remove("active");
                if (onConfirm) setTimeout(onConfirm, 250);
            };
        }

        // Helper to stop and hide the rotating spinner and show a clean status icon instead
        function showStatusIcon(type) {
            spinner.style.animationPlayState = "paused";
            spinner.style.display = "none";
            const statusIcon = document.getElementById("statusIcon");
            const icons = {
                success: "fa-solid fa-circle-check",
                error: "fa-solid fa-circle-xmark",
                warning: "fa-solid fa-triangle-exclamation"
            };
            statusIcon.className = `vortex-modal-icon ${type}`;
            statusIcon.innerHTML = `<i class="${icons[type] || icons.warning}"></i>`;
            statusIcon.style.display = "flex";
        }

        // 1. Retrieve data saved from checkout.js
        const checkoutData = JSON.parse(localStorage.getItem("vortex_checkout_data"));
        const statusText = document.getElementById("statusText");
        const subText = document.getElementById("subText");
        const backBtn = document.getElementById("backBtn");
        const spinner = document.getElementById("spinner");
        const receiptStub = document.getElementById("receiptStub");

        let isPaymentComplete = false;

        // Kick user back if they directly navigated here without checking out
        if (!checkoutData) {
            spinner.style.display = "none";
            statusText.textContent = "No Active Session";
            subText.textContent = "No pending payment found.";
            showVortexModal({
                type: "warning",
                title: "No Pending Payment",
                message: "No active checkout session was found. Redirecting you to the home page.",
                btnText: "Go to Home",
                onConfirm: () => { window.location.href = "./index.html"; }
            });
        }

        const RAZORPAY_KEY_ID = "rzp_test_TzXYIuY47SGvh0";

        async function startPayment() {
            if (!checkoutData) return;
            try {
                // Reset UI in case it's a retry
                backBtn.style.display = "none";
                document.getElementById("statusIcon").style.display = "none";
                receiptStub.style.display = "none";
                spinner.style.display = "block";
                statusText.textContent = "Connecting to Bank...";
                statusText.style.color = "var(--text-main)";
                subText.textContent = "Fetching secure order token.";
                spinner.style.borderTopColor = "var(--primary-cyan)";
                spinner.style.animationPlayState = "running";

                // 2. Fetch the Order ID from Vercel Backend
                const response = await fetch("https://vortex-backend-ten.vercel.app/api/create-order", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ amount: checkoutData.billing.total })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Server Error (${response.status}): ` + errText);
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.message || "Failed to create Razorpay order");
                }

                // 3. Configure the Razorpay Popup
                const options = {
                    key: RAZORPAY_KEY_ID,
                    amount: data.order.amount,
                    currency: "INR",
                    name: "Vortex 14.0",
                    description: "Fest Registration Fee",
                    order_id: data.order.id, 
                    prefill: {
                        name: checkoutData.name,
                        email: checkoutData.email,
                        contact: checkoutData.phone
                    },
                    theme: {
                        color: "#bd00ff"
                    },
                    modal: {
                        ondismiss: function() {
                            showStatusIcon("warning");
                            statusText.textContent = "Payment Cancelled";
                            subText.textContent = "You closed the payment window. You can go back to review your details and try again.";
                            backBtn.style.display = "block";
                        }
                    },
                    handler: async function (response) {
                        console.log("Payment Successful!", response);
                        
                        statusText.textContent = "Verifying Payment...";
                        subText.textContent = "Updating your registration status...";
                        spinner.style.borderTopColor = "var(--success-green)";

                        try {
                            // Send payment details to backend to mark DB entry as "Paid"
                            const verifyRes = await fetch("https://vortex-backend-ten.vercel.app/api/verify-payment", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_signature: response.razorpay_signature,
                                    email: checkoutData.email,
                                    phone: checkoutData.phone
                                })
                            });

                            const verifyData = await verifyRes.json();
                            if (!verifyData.success) {
                                console.error("Verification warning:", verifyData.message);
                            }
                        } catch (err) {
                            console.error("Failed to update status in DB:", err);
                        }

                        // Stop & hide the rotating spinner, display on-page VIP receipt pass
                        isPaymentComplete = true;
                        showStatusIcon("success");
                        statusText.textContent = "Registration Confirmed!";
                        statusText.style.color = "var(--success-green)";
                        subText.textContent = "Your Vortex 14.0 pass is locked in. Screenshot this receipt for entry.";

                        receiptStub.className = "vortex-ticket-stub";
                        receiptStub.innerHTML = `
                            <div class="vortex-ticket-row"><span>Participant</span><strong>${checkoutData.name}</strong></div>
                            <div class="vortex-ticket-row"><span>Events</span><strong>${checkoutData.cart ? checkoutData.cart.length : 0} Registered</strong></div>
                            <div class="vortex-ticket-row"><span>Amount Paid</span><strong style="color:var(--success-green)">₹${checkoutData.billing.total}</strong></div>
                            <div class="vortex-ticket-row"><span>Payment ID</span><strong>${response.razorpay_payment_id}</strong></div>
                        `;
                        receiptStub.style.display = "block";

                        checkoutData.paymentId = response.razorpay_payment_id;
                        localStorage.setItem("vortex_checkout_data", JSON.stringify(checkoutData));
                        localStorage.removeItem("vortex_cart");

                        backBtn.textContent = "Return to Home";
                        backBtn.style.display = "block";
                    }
                };

                // Launch the gateway
                const rzp = new Razorpay(options);
                
                rzp.on('payment.failed', function (response){
                    console.error("Payment Failed", response.error);
                    showStatusIcon("error");
                    statusText.textContent = "Payment Failed";
                    statusText.style.color = "#ff4757";
                    subText.textContent = response.error.description || "Transaction declined by bank.";
                    backBtn.style.display = "block";
                });

                statusText.textContent = "Awaiting Payment...";
                subText.textContent = "Please complete the transaction in the popup window.";
                rzp.open();

            } catch (error) {
                console.error("Gateway Error:", error);
                showStatusIcon("error");
                statusText.textContent = "Gateway Error";
                statusText.style.color = "#ff4757";
                subText.textContent = error.message || "Failed to connect to the payment server.";
                backBtn.style.display = "block";
            }
        }

        // Attach listener: goes to index.html if payment succeeded, or back to checkout.html if cancelled/failed
        backBtn.addEventListener("click", () => {
            if (isPaymentComplete) {
                window.location.href = "./index.html";
            } else {
                window.location.href = "./checkout.html";
            }
        });

        // Auto-start payment process 1 second after page loads
        window.addEventListener("DOMContentLoaded", () => {
            if (checkoutData) {
                setTimeout(startPayment, 1000);
            }
        });
    </script>
</body>
</html>
