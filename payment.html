<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Vortex 14.0</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Links to your existing styles -->
    <link rel="stylesheet" href="./css/index.css" />
    
    <!-- Razorpay SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        .payment-container {
            height: calc(100vh - 75px);
            margin-top: 75px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        
        .payment-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 3rem 2rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 243, 255, 0.1);
            border-top-color: var(--primary-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .retry-btn {
            display: none;
            margin-top: 1.5rem;
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, var(--primary-cyan), var(--primary-purple));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .retry-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Minimal Navbar -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="photos/vortex_L.png" alt="Vortex 14.0" class="logo-light" />
            <img src="photos/vortex_D.png" alt="Vortex 14.0" class="logo-dark" />
        </a>
    </nav>

    <!-- Background Elements -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Payment UI -->
    <main class="payment-container">
        <div class="payment-box">
            <div class="spinner" id="spinner"></div>
            <h2 class="font-heading" id="statusText" style="font-size: 1.2rem; color: var(--text-main);">Initializing Secure Gateway...</h2>
            <p id="subText" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">Please do not refresh or close this page.</p>
            
            <button id="retryBtn" class="retry-btn">Retry Payment</button>
        </div>
    </main>

    <script>
        // 1. Retrieve data saved from checkout.js
        const checkoutData = JSON.parse(localStorage.getItem("vortex_checkout_data"));
        const statusText = document.getElementById("statusText");
        const subText = document.getElementById("subText");
        const retryBtn = document.getElementById("retryBtn");
        const spinner = document.getElementById("spinner");

        // Kick user back if they directly navigated here without checking out
        if (!checkoutData) {
            alert("No pending payment found. Redirecting to home.");
            window.location.href = "./index.html";
        }

        const RAZORPAY_KEY_ID = "rzp_test_TzXYIuY47SGvh0";

        async function startPayment() {
            try {
                // Reset UI in case it's a retry
                retryBtn.style.display = "none";
                statusText.textContent = "Connecting to Bank...";
                subText.textContent = "Fetching secure order token.";
                spinner.style.borderTopColor = "var(--primary-cyan)";
                spinner.style.animationPlayState = "running";

                // 2. Fetch the Order ID from Vercel Backend
                const response = await fetch("https://vortex-backend-ten.vercel.app/api/create-order", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ amount: checkoutData.billing.total })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Server Error (${response.status}): ` + errText);
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.message || "Failed to create Razorpay order");
                }

                // 3. Configure the Razorpay Popup
                const options = {
                    key: RAZORPAY_KEY_ID,
                    amount: data.order.amount,
                    currency: "INR",
                    name: "Vortex 14.0",
                    description: "Fest Registration Fee",
                    order_id: data.order.id, 
                    prefill: {
                        name: checkoutData.name,
                        email: checkoutData.email,
                        contact: checkoutData.phone
                    },
                    theme: {
                        color: "#bd00ff"
                    },
                    modal: {
                        ondismiss: function() {
                            statusText.textContent = "Payment Cancelled";
                            subText.textContent = "You closed the payment window.";
                            spinner.style.animationPlayState = "paused";
                            retryBtn.style.display = "block";
                        }
                    },
                    handler: async function (response) {
                        console.log("Payment Successful!", response);
                        
                        statusText.textContent = "Verifying Payment...";
                        subText.textContent = "Updating your registration status...";
                        spinner.style.borderTopColor = "var(--success-green)";

                        try {
                            // Send payment details to backend to mark DB entry as "Paid"
                            const verifyRes = await fetch("https://vortex-backend-ten.vercel.app/api/verify-payment", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_signature: response.razorpay_signature,
                                    email: checkoutData.email,
                                    phone: checkoutData.phone
                                })
                            });

                            const verifyData = await verifyRes.json();
                            if (!verifyData.success) {
                                console.error("Verification warning:", verifyData.message);
                            }
                        } catch (err) {
                            console.error("Failed to update status in DB:", err);
                        }

                        // Update UI
                        statusText.textContent = "Payment Successful!";
                        statusText.style.color = "var(--success-green)";
                        subText.textContent = `Payment ID: ${response.razorpay_payment_id}`;
                        spinner.style.animationPlayState = "paused";
                        
                        checkoutData.paymentId = response.razorpay_payment_id;
                        localStorage.setItem("vortex_checkout_data", JSON.stringify(checkoutData));
                        localStorage.removeItem("vortex_cart");
                        
                        setTimeout(() => {
                            alert("Registration Complete! We will now redirect you to the home page.");
                            window.location.href = "./index.html";
                        }, 2000);
                    }
                };

                // Launch the gateway
                const rzp = new Razorpay(options);
                
                rzp.on('payment.failed', function (response){
                    console.error("Payment Failed", response.error);
                    statusText.textContent = "Payment Failed";
                    statusText.style.color = "#ff4757";
                    subText.textContent = response.error.description || "Transaction declined by bank.";
                    spinner.style.animationPlayState = "paused";
                    spinner.style.borderTopColor = "#ff4757";
                    retryBtn.style.display = "block";
                });

                statusText.textContent = "Awaiting Payment...";
                subText.textContent = "Please complete the transaction in the popup window.";
                rzp.open();

            } catch (error) {
                console.error("Gateway Error:", error);
                statusText.textContent = "Gateway Error";
                statusText.style.color = "#ff4757";
                subText.textContent = error.message || "Failed to connect to the payment server.";
                spinner.style.animationPlayState = "paused";
                spinner.style.borderTopColor = "#ff4757";
                retryBtn.style.display = "block";
            }
        }

        // Attach retry listener
        retryBtn.addEventListener("click", startPayment);

        // Auto-start payment process 1 second after page loads
        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(startPayment, 1000);
        });
    </script>
</body>
</html>
